name: Worker regression tests
on:
  push:
    branches: [feature/brave-chat-bridge, feature/active-chat-gui-20261128]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Python tests
        run: python -m pytest -q
      - name: Brave JavaScript fixture tests
        run: node --test tests/*.cjs
