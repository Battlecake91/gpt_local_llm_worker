<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Worker Bridge</title><style>
body{font:14px system-ui,sans-serif;padding:16px;line-height:1.5}h1{font-size:18px}dt{font-weight:bold;margin-top:10px}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:8px}input[type=password]{width:100%;box-sizing:border-box}button{margin:8px 6px 8px 0}
</style></head><body><h1>ChatGPT Bridge</h1><label><input type="checkbox" id="enabled"> Erkennung aktiviert</label><dl><dt>Worker</dt><dd id="worker">...</dd><dt>ChatGPT</dt><dd id="chat">...</dd><dt>Letzte Antwort</dt><dd><pre id="capture">...</pre></dd><dt>Letzte Übertragung</dt><dd id="transfer">...</dd><dt>Ausgehende Nachricht</dt><dd id="outbound">...</dd><dt>Wartende Antworten</dt><dd id="pending">0</dd><dt>Fehler</dt><dd id="error">keiner</dd></dl><label>Lokales Worker-Token <input id="token" type="password" autocomplete="off" placeholder="Token eingeben"></label><button id="save">Token für Sitzung setzen</button><button id="sync">Jetzt synchronisieren</button><script src="panel.js"></script></body></html>
